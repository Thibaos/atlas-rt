[package]
name = "atlas-rt-godot"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
godot = "0.5.5"
atlas-rt = { path = "../atlas-rt" }
glam = "0.33"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
exit = "deny"
